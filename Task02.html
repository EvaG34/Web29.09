<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 02</title>
</head>
<body>
    <script>
        class Cylinder {
            #height;
            #radius;
            constructor(height, radius) {
                this.#height = height;
                this.#radius = radius;
            }
            get height() {
                return this.#height;
            }
            set height(value) {
                this.#height = value;
            }
             get radius() {
                return this.#radius;
            }

            set radius(value){
                this.#radius = value;
            }

            getVolume() {
                return Math * this.radius * this.radius * this.height;
            }
        }

        let cylinder1 = new Cylinder(10, 5);
        let cylinder2 = new Cylinder(20, 3);

        console.log("Обьем цилиндра 1: " + cylinder1.getVolume());
        console.log("Обьем цилиндра 2: " + cylinder2.getVolume());
    </script>
</body>

</html>
